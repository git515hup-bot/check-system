<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>الحاسبة العلمية المتطورة | SciCalc Pro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', 'Cairo', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .calculator {
            max-width: 550px;
            width: 100%;
            background: #0f0f1a;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid #2a2a3a;
        }

        /* شاشة العرض */
        .display {
            background: #0a0a0f;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #00ff88;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .expression {
            color: #888;
            font-size: 14px;
            min-height: 24px;
            font-family: monospace;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }

        .result {
            color: #00ff88;
            font-size: 32px;
            font-weight: bold;
            font-family: monospace;
            word-break: break-all;
            direction: ltr;
            text-align: left;
            line-height: 1.3;
        }

        .fraction-preview {
            color: #ffaa44;
            font-size: 12px;
            margin-top: 5px;
            direction: ltr;
        }

        /* التبديل بين الوضعين */
        .mode-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .mode-btn {
            background: #1e2a3a;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: #fff;
            font-size: 12px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #00ff88;
            color: #0a0a12;
        }

        /* شبكة الأزرار */
        .buttons {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        button {
            background: #1e2a3a;
            border: none;
            padding: 12px 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.05s linear;
            font-family: monospace;
        }

        button:active {
            transform: scale(0.96);
            background: #00ff88;
            color: #000;
        }

        .btn-num {
            background: #2a3a4a;
        }

        .btn-func {
            background: #3a2a4a;
            color: #ff88ff;
        }

        .btn-trig {
            background: #2a4a3a;
            color: #88ff88;
        }

        .btn-mem {
            background: #4a3a2a;
            color: #ffaa44;
        }

        .btn-clear {
            background: #ff4444;
        }

        .btn-equals {
            background: #00ff88;
            color: #000;
        }

        .btn-frac {
            background: #ff7b00;
            color: #fff;
        }

        /* زر الحل المعادلات */
        .btn-solve {
            background: #aa44ff;
            color: #fff;
        }

        /* سجل الحسابات والذاكرة */
        .bottom-panel {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .history, .memory {
            flex: 1;
            background: #0a0a0f;
            border-radius: 15px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
        }

        .panel-title {
            font-size: 10px;
            color: #888;
            margin-bottom: 8px;
        }

        .history-item, .mem-item {
            font-size: 11px;
            color: #aaa;
            padding: 4px;
            font-family: monospace;
            border-bottom: 1px solid #222;
            cursor: pointer;
            direction: ltr;
            text-align: left;
        }

        .history-item:hover, .mem-item:hover {
            background: #1a2a3a;
        }

        @media (max-width: 550px) {
            .buttons {
                gap: 5px;
            }
            button {
                padding: 8px 0;
                font-size: 11px;
            }
            .result {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="mode-bar">
            <button class="mode-btn active" id="modeBasic">عادي</button>
            <button class="mode-btn" id="modeScientific">علمي</button>
            <button class="mode-btn" id="modeFraction">كسور</button>
            <button class="mode-btn" id="modeEquation">معادلات</button>
        </div>

        <div class="display">
            <div class="expression" id="expression"></div>
            <div class="result" id="result">0</div>
            <div class="fraction-preview" id="fractionPreview"></div>
        </div>

        <div class="buttons" id="buttonsContainer">
            <!-- الأزرار ستتحكم بها JavaScript -->
        </div>

        <div class="bottom-panel">
            <div class="history">
                <div class="panel-title">📜 السجل</div>
                <div id="historyList"></div>
            </div>
            <div class="memory">
                <div class="panel-title">💾 الذاكرة (M)</div>
                <div id="memoryList"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== الحاسبة العلمية المتطورة ====================
        class ScientificCalculator {
            constructor() {
                this.currentInput = '';
                this.result = '0';
                this.history = [];
                this.memory = [];     // ذاكرة متعددة (M1, M2, M3...)
                this.mode = 'basic';  // basic, scientific, fraction, equation
                this.lastResult = null;
                this.loadFromStorage();
                this.initButtons();
                this.updateDisplay();
            }

            // تحميل من localStorage
            loadFromStorage() {
                const savedHistory = localStorage.getItem('sci_history');
                const savedMemory = localStorage.getItem('sci_memory');
                if (savedHistory) this.history = JSON.parse(savedHistory);
                if (savedMemory) this.memory = JSON.parse(savedMemory);
                this.renderHistory();
                this.renderMemory();
            }

            // حفظ إلى localStorage
            saveToStorage() {
                localStorage.setItem('sci_history', JSON.stringify(this.history.slice(0, 20)));
                localStorage.setItem('sci_memory', JSON.stringify(this.memory));
            }

            // إضافة إلى السجل
            addToHistory(expr, res) {
                this.history.unshift({ expr, res, time: new Date().toLocaleTimeString() });
                if (this.history.length > 20) this.history.pop();
                this.saveToStorage();
                this.renderHistory();
            }

            // عرض السجل
            renderHistory() {
                const container = document.getElementById('historyList');
                if (this.history.length === 0) {
                    container.innerHTML = '<div style="color:#555; text-align:center;">فارغ</div>';
                    return;
                }
                container.innerHTML = this.history.map(h => 
                    `<div class="history-item" onclick="calc.pasteExpression('${h.expr.replace(/'/g, "\\'")}')">
                        ${h.expr} = ${h.res}
                    </div>`
                ).join('');
            }

            // عرض الذاكرة
            renderMemory() {
                const container = document.getElementById('memoryList');
                if (this.memory.length === 0) {
                    container.innerHTML = '<div style="color:#555; text-align:center;">فارغة</div>';
                    return;
                }
                container.innerHTML = this.memory.map((val, idx) => 
                    `<div class="mem-item" onclick="calc.pasteMemory(${idx})">
                        M${idx+1}: ${val}
                    </div>`
                ).join('');
            }

            // لصق من السجل
            pasteExpression(expr) {
                this.currentInput = expr;
                this.updateDisplay();
            }

            // لصق من الذاكرة
            pasteMemory(idx) {
                this.currentInput += this.memory[idx];
                this.updateDisplay();
            }

            // إضافة إلى الذاكرة
            addToMemory() {
                const val = this.evaluateExpression(this.currentInput);
                if (!isNaN(val) && isFinite(val)) {
                    this.memory.push(val);
                    this.saveToStorage();
                    this.renderMemory();
                }
            }

            // مسح الذاكرة
            clearMemory() {
                this.memory = [];
                this.saveToStorage();
                this.renderMemory();
            }

            // تقييم التعبير الرياضي
            evaluateExpression(expr) {
                if (!expr.trim()) return NaN;
                
                // تحويل الرموز
                let processed = expr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/π/g, 'Math.PI')
                    .replace(/π/g, 'Math.PI')
                    .replace(/e/g, 'Math.E')
                    .replace(/√\(/g, 'Math.sqrt(')
                    .replace(/sin\(/g, 'Math.sin(')
                    .replace(/cos\(/g, 'Math.cos(')
                    .replace(/tan\(/g, 'Math.tan(')
                    .replace(/asin\(/g, 'Math.asin(')
                    .replace(/acos\(/g, 'Math.acos(')
                    .replace(/atan\(/g, 'Math.atan(')
                    .replace(/sinh\(/g, 'Math.sinh(')
                    .replace(/cosh\(/g, 'Math.cosh(')
                    .replace(/tanh\(/g, 'Math.tanh(')
                    .replace(/log\(/g, 'Math.log10(')
                    .replace(/ln\(/g, 'Math.log(')
                    .replace(/\^/g, '**')
                    .replace(/fact\(/g, 'factorial(');
                
                // دالة العاملي
                window.factorial = (n) => {
                    if (n < 0) return NaN;
                    if (n === 0 || n === 1) return 1;
                    let result = 1;
                    for (let i = 2; i <= n; i++) result *= i;
                    return result;
                };
                
                try {
                    // استخدام Function بدلاً من eval للأمان النسبي
                    const fn = new Function('return (' + processed + ')');
                    let val = fn();
                    return Math.round(val * 1e12) / 1e12;
                } catch(e) {
                    return NaN;
                }
            }

            // حساب النتيجة
            compute() {
                if (!this.currentInput.trim()) return;
                const value = this.evaluateExpression(this.currentInput);
                if (!isNaN(value) && isFinite(value)) {
                    this.result = value.toString();
                    this.addToHistory(this.currentInput, this.result);
                    this.lastResult = value;
                    this.currentInput = this.result;
                } else {
                    this.result = 'خطأ';
                }
                this.updateDisplay();
            }

            // إدخال كسر (a/b)
            addFraction() {
                this.currentInput += '÷';
                this.updateDisplay();
            }

            // حل معادلة بسيطة (ax + b = 0)
            solveLinear() {
                try {
                    // تتوقع صيغة: 2x+3=7
                    let eq = this.currentInput;
                    let [left, right] = eq.split('=');
                    if (!right) {
                        this.result = 'ضع = في المعادلة';
                        this.updateDisplay();
                        return;
                    }
                    right = right.trim();
                    left = left.trim();
                    
                    // استخراج المعاملات
                    let a = 0, b = 0;
                    let terms = left.split(/(?=[+-])/);
                    for (let term of terms) {
                        if (term.includes('x')) {
                            let coeff = term.replace('x', '');
                            if (coeff === '' || coeff === '+') a += 1;
                            else if (coeff === '-') a -= 1;
                            else a += parseFloat(coeff);
                        } else {
                            b += parseFloat(term);
                        }
                    }
                    // نقل الثابت إلى الطرف الآخر
                    let totalConst = parseFloat(right) - b;
                    if (a === 0) {
                        this.result = 'لا يمكن الحل';
                    } else {
                        let solution = totalConst / a;
                        this.result = `x = ${solution}`;
                        this.addToHistory(this.currentInput, this.result);
                        this.currentInput = solution.toString();
                    }
                    this.updateDisplay();
                } catch(e) {
                    this.result = 'خطأ في المعادلة';
                    this.updateDisplay();
                }
            }

            // إضافة رمز
            addSymbol(sym) {
                this.currentInput += sym;
                this.updateDisplay();
            }

            // مسح الكل
            clear() {
                this.currentInput = '';
                this.result = '0';
                this.updateDisplay();
            }

            // حذف آخر حرف
            backspace() {
                this.currentInput = this.currentInput.slice(0, -1);
                this.updateDisplay();
            }

            // عرض كسر حي (عرض فقط)
            showFractionPreview() {
                if (this.currentInput.includes('÷')) {
                    let parts = this.currentInput.split('÷');
                    if (parts.length === 2) {
                        document.getElementById('fractionPreview').innerHTML = 
                            `${parts[0]}<span style="border-top:1px solid #ffaa44; padding:0 5px;">${parts[1]}</span>`;
                        return;
                    }
                }
                document.getElementById('fractionPreview').innerHTML = '';
            }

            // تحديث الشاشة
            updateDisplay() {
                document.getElementById('expression').innerHTML = this.currentInput || '';
                document.getElementById('result').innerHTML = this.result;
                this.showFractionPreview();
            }

            // تغيير الوضع
            setMode(mode) {
                this.mode = mode;
                this.initButtons();
                this.updateDisplay();
            }

            // تهيئة الأزرار حسب الوضع
            initButtons() {
                const container = document.getElementById('buttonsContainer');
                
                // الأزرار الأساسية (موجودة في كل الأوضاع)
                const basicButtons = [
                    { text: 'C', class: 'btn-clear', action: () => this.clear() },
                    { text: '⌫', class: 'btn-clear', action: () => this.backspace() },
                    { text: '(', class: 'btn-num', action: () => this.addSymbol('(') },
                    { text: ')', class: 'btn-num', action: () => this.addSymbol(')') },
                    { text: '7', class: 'btn-num', action: () => this.addSymbol('7') },
                    { text: '8', class: 'btn-num', action: () => this.addSymbol('8') },
                    { text: '9', class: 'btn-num', action: () => this.addSymbol('9') },
                    { text: '÷', class: 'btn-func', action: () => this.addSymbol('÷') },
                    { text: '4', class: 'btn-num', action: () => this.addSymbol('4') },
                    { text: '5', class: 'btn-num', action: () => this.addSymbol('5') },
                    { text: '6', class: 'btn-num', action: () => this.addSymbol('6') },
                    { text: '×', class: 'btn-func', action: () => this.addSymbol('×') },
                    { text: '1', class: 'btn-num', action: () => this.addSymbol('1') },
                    { text: '2', class: 'btn-num', action: () => this.addSymbol('2') },
                    { text: '3', class: 'btn-num', action: () => this.addSymbol('3') },
                    { text: '-', class: 'btn-func', action: () => this.addSymbol('-') },
                    { text: '0', class: 'btn-num', action: () => this.addSymbol('0') },
                    { text: '.', class: 'btn-num', action: () => this.addSymbol('.') },
                    { text: '=', class: 'btn-equals', action: () => this.compute() },
                    { text: '+', class: 'btn-func', action: () => this.addSymbol('+') },
                ];

                // أزرار الوضع العلمي
                const scientificButtons = [
                    { text: 'sin', class: 'btn-trig', action: () => this.addSymbol('sin(') },
                    { text: 'cos', class: 'btn-trig', action: () => this.addSymbol('cos(') },
                    { text: 'tan', class: 'btn-trig', action: () => this.addSymbol('tan(') },
                    { text: 'asin', class: 'btn-trig', action: () => this.addSymbol('asin(') },
                    { text: 'acos', class: 'btn-trig', action: () => this.addSymbol('acos(') },
                    { text: 'atan', class: 'btn-trig', action: () => this.addSymbol('atan(') },
                    { text: 'sinh', class: 'btn-trig', action: () => this.addSymbol('sinh(') },
                    { text: 'cosh', class: 'btn-trig', action: () => this.addSymbol('cosh(') },
                    { text: 'tanh', class: 'btn-trig', action: () => this.addSymbol('tanh(') },
                    { text: '√', class: 'btn-func', action: () => this.addSymbol('√(') },
                    { text: 'log', class: 'btn-func', action: () => this.addSymbol('log(') },
                    { text: 'ln', class: 'btn-func', action: () => this.addSymbol('ln(') },
                    { text: 'x²', class: 'btn-func', action: () => this.addSymbol('^2') },
                    { text: 'x³', class: 'btn-func', action: () => this.addSymbol('^3') },
                    { text: 'xʸ', class: 'btn-func', action: () => this.addSymbol('^') },
                    { text: 'eˣ', class: 'btn-func', action: () => this.addSymbol('exp(') },
                    { text: 'π', class: 'btn-func', action: () => this.addSymbol('π') },
                    { text: 'e', class: 'btn-func', action: () => this.addSymbol('e') },
                    { text: '!', class: 'btn-func', action: () => this.addSymbol('fact(') },
                    { text: 'M+', class: 'btn-mem', action: () => this.addToMemory() },
                    { text: 'MC', class: 'btn-mem', action: () => this.clearMemory() },
                ];

                // أزرار الكسور
                const fractionButtons = [
                    { text: 'a/b', class: 'btn-frac', action: () => this.addFraction() },
                    { text: '⇄', class: 'btn-frac', action: () => this.compute() },
                ];

                // أزرار المعادلات
                const equationButtons = [
                    { text: '=0', class: 'btn-solve', action: () => this.solveLinear() },
                ];

                let buttons = [...basicButtons];
                if (this.mode === 'scientific') buttons = [...basicButtons, ...scientificButtons];
                if (this.mode === 'fraction') buttons = [...basicButtons, ...fractionButtons];
                if (this.mode === 'equation') buttons = [...basicButtons, ...equationButtons];

                // ترتيب الأزرار في شبكة 6 أعمدة
                container.innerHTML = '';
                buttons.forEach(btn => {
                    const button = document.createElement('button');
                    button.textContent = btn.text;
                    button.className = btn.class;
                    button.onclick = btn.action;
                    container.appendChild(button);
                });
            }
        }

        // تهيئة الحاسبة
        const calc = new ScientificCalculator();
        window.calc = calc;

        // تبديل الأوضاع
        document.getElementById('modeBasic').onclick = () => { 
            calc.setMode('basic');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('modeBasic').classList.add('active');
        };
        document.getElementById('modeScientific').onclick = () => { 
            calc.setMode('scientific');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('modeScientific').classList.add('active');
        };
        document.getElementById('modeFraction').onclick = () => { 
            calc.setMode('fraction');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('modeFraction').classList.add('active');
        };
        document.getElementById('modeEquation').onclick = () => { 
            calc.setMode('equation');
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('modeEquation').classList.add('active');
        };
    </script>
</body>
</html>
