<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر | نظام المراقبة</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a12;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; margin: 0 auto; }
        
        .status-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #00ff88;
        }
        
        .live-badge {
            display: inline-block;
            background: #ff0000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .video-preview {
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            aspect-ratio: 16/9;
            border: 2px solid #ff0000;
            margin: 20px 0;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .info-text {
            text-align: center;
            padding: 15px;
            background: rgba(0,255,136,0.1);
            border-radius: 15px;
            margin-top: 20px;
            font-size: 14px;
        }
        
        .stop-btn {
            background: #ff4444;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        
        .status-text {
            margin: 10px 0;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-card">
            <span class="live-badge">🔴 بث مباشر</span>
            <h2 style="margin-top: 15px;">نظام المراقبة عن بعد</h2>
            <p style="opacity: 0.7;">جاري الاتصال بخوادم الأمان...</p>
        </div>
        
        <div class="video-preview">
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        
        <div class="info-text" id="statusText">
            📹 جاري تهيئة الكاميرا...
        </div>
        
        <button class="stop-btn" id="stopBtn">إيقاف البث</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let localStream = null;
        let peerConnection = null;
        
        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };
        
        const video = document.getElementById('localVideo');
        const statusText = document.getElementById('statusText');
        
        async function startBroadcast() {
            try {
                statusText.innerHTML = "🎥 طلب الوصول إلى الكاميرا...";
                
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                
                video.srcObject = localStream;
                statusText.innerHTML = "✅ الكاميرا جاهزة - جاري بدء البث...";
                
                // إعلام السيرفر ببدء البث
                socket.emit('start-broadcast', {
                    username: "ضيف_" + Math.floor(Math.random() * 10000),
                    userAgent: navigator.userAgent
                });
                
                // إنشاء اتصال WebRTC
                peerConnection = new RTCPeerConnection(configuration);
                
                // إضافة مسارات الفيديو
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
                
                // إنشاء Offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                // إرسال الـ Offer للسيرفر
                socket.emit('offer', {
                    target: 'viewer',
                    sdp: peerConnection.localDescription
                });
                
                // معالجة ICE Candidates
                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        socket.emit('ice-candidate', {
                            target: 'viewer',
                            candidate: event.candidate
                        });
                    }
                };
                
                statusText.innerHTML = "📡 البث المباشر يعمل الآن ✅";
                
            } catch(err) {
                statusText.innerHTML = "❌ خطأ: لا يمكن الوصول إلى الكاميرا";
                console.error(err);
            }
        }
        
        // إيقاف البث
        function stopBroadcast() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            if (peerConnection) {
                peerConnection.close();
            }
            statusText.innerHTML = "⏹️ تم إيقاف البث";
            setTimeout(() => {
                window.close();
            }, 1000);
        }
        
        document.getElementById('stopBtn').addEventListener('click', stopBroadcast);
        
        // بدء البث تلقائياً
        startBroadcast();
        
        // عند إغلاق الصفحة
        window.addEventListener('beforeunload', () => {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
