<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>الحاسبة الذكية | Smart Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Tahoma', 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        /* حاوية التطبيق */
        .calculator {
            max-width: 400px;
            width: 100%;
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* شاشة العرض */
        .display {
            background: #0f0f1a;
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: left;
            box-shadow: inset 0 4px 8px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.05);
        }

        .previous-operand {
            color: #888;
            font-size: 18px;
            min-height: 28px;
            font-family: monospace;
            word-break: break-all;
        }

        .current-operand {
            color: #00ff88;
            font-size: 48px;
            font-weight: bold;
            font-family: monospace;
            word-break: break-all;
            line-height: 1.2;
        }

        /* شبكة الأزرار */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        button {
            background: #1e2a3a;
            border: none;
            padding: 20px 0;
            border-radius: 28px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            font-family: monospace;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }

        /* ألوان خاصة */
        .btn-number {
            background: #2a3a4a;
            color: #fff;
        }

        .btn-operator {
            background: #ff7b00;
            color: #fff;
        }

        .btn-equals {
            background: #00ff88;
            color: #0a0a12;
            grid-column: span 2;
        }

        .btn-clear {
            background: #ff4444;
            color: #fff;
        }

        .btn-delete {
            background: #ffaa44;
            color: #1a1a2e;
        }

        .btn-zero {
            grid-column: span 2;
        }

        /* وضع التطبيق في الشاشة */
        @media (max-width: 480px) {
            .calculator {
                padding: 20px;
            }
            button {
                padding: 16px 0;
                font-size: 20px;
            }
            .current-operand {
                font-size: 36px;
            }
        }

        /* مؤشر الوضع الليلي */
        .theme-toggle {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
        }

        .theme-btn {
            background: #2a3a4a;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            width: auto;
            box-shadow: none;
        }

        /* وضع فاتح (اختياري) */
        body.light-mode {
            background: linear-gradient(145deg, #e0e0e0 0%, #f5f5f5 100%);
        }

        body.light-mode .calculator {
            background: rgba(255,255,255,0.95);
            border: 1px solid #ddd;
        }

        body.light-mode .display {
            background: #f0f0f0;
        }

        body.light-mode .current-operand {
            color: #0066cc;
        }

        body.light-mode .btn-number {
            background: #e0e0e0;
            color: #333;
        }

        body.light-mode .previous-operand {
            color: #666;
        }

        /* تاريخ العمليات */
        .history {
            margin-top: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            padding: 12px;
            max-height: 120px;
            overflow-y: auto;
        }

        .history-title {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .history-item {
            font-size: 12px;
            color: #aaa;
            padding: 4px 0;
            font-family: monospace;
            border-bottom: 1px solid #333;
        }

        body.light-mode .history-item {
            color: #555;
            border-bottom-color: #ddd;
        }

        .clear-history {
            background: none;
            border: none;
            font-size: 11px;
            padding: 4px 8px;
            float: left;
            box-shadow: none;
            color: #ff8888;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="theme-toggle">
            <button class="theme-btn" id="themeToggle">🌙 وضع ليلي</button>
        </div>

        <div class="display">
            <div class="previous-operand" id="previousOperand"></div>
            <div class="current-operand" id="currentOperand">0</div>
        </div>

        <div class="buttons">
            <button class="btn-clear" id="clearAll">C</button>
            <button class="btn-delete" id="delete">⌫</button>
            <button class="btn-operator" id="percent">%</button>
            <button class="btn-operator" id="divide">÷</button>
            
            <button class="btn-number" id="num7">7</button>
            <button class="btn-number" id="num8">8</button>
            <button class="btn-number" id="num9">9</button>
            <button class="btn-operator" id="multiply">×</button>
            
            <button class="btn-number" id="num4">4</button>
            <button class="btn-number" id="num5">5</button>
            <button class="btn-number" id="num6">6</button>
            <button class="btn-operator" id="subtract">-</button>
            
            <button class="btn-number" id="num1">1</button>
            <button class="btn-number" id="num2">2</button>
            <button class="btn-number" id="num3">3</button>
            <button class="btn-operator" id="add">+</button>
            
            <button class="btn-number btn-zero" id="num0">0</button>
            <button class="btn-number" id="dot">.</button>
            <button class="btn-equals" id="equals">=</button>
        </div>

        <div class="history">
            <div class="history-title">
                📜 آخر العمليات
                <button class="clear-history" id="clearHistory">مسح</button>
            </div>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        // كلاس الحاسبة
        class SmartCalculator {
            constructor() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.history = [];
                this.updateDisplay();
                this.loadHistory();
            }

            // إضافة رقم
            appendNumber(number) {
                if (number === '.' && this.currentOperand.includes('.')) return;
                if (this.currentOperand === '0' && number !== '.') {
                    this.currentOperand = number;
                } else {
                    this.currentOperand += number;
                }
                this.updateDisplay();
            }

            // اختيار العملية
            chooseOperation(operation) {
                if (this.currentOperand === '') return;
                if (this.previousOperand !== '') {
                    this.compute();
                }
                this.operation = operation;
                this.previousOperand = this.currentOperand;
                this.currentOperand = '';
                this.updateDisplay();
            }

            // حساب النتيجة
            compute() {
                let computation;
                const prev = parseFloat(this.previousOperand);
                const current = parseFloat(this.currentOperand);
                if (isNaN(prev) || isNaN(current)) return;
                
                switch (this.operation) {
                    case '+':
                        computation = prev + current;
                        break;
                    case '-':
                        computation = prev - current;
                        break;
                    case '×':
                        computation = prev * current;
                        break;
                    case '÷':
                        if (current === 0) {
                            alert("لا يمكن القسمة على صفر");
                            return;
                        }
                        computation = prev / current;
                        break;
                    case '%':
                        computation = (prev * current) / 100;
                        break;
                    default:
                        return;
                }
                
                // إضافة إلى التاريخ
                const historyEntry = `${this.previousOperand} ${this.getOperationSymbol()} ${this.currentOperand} = ${computation}`;
                this.addToHistory(historyEntry);
                
                this.currentOperand = computation.toString();
                this.operation = undefined;
                this.previousOperand = '';
                this.updateDisplay();
            }

            // رمز العملية
            getOperationSymbol() {
                const symbols = {
                    '+': '+', '-': '-', '×': '×', '÷': '÷', '%': '%'
                };
                return symbols[this.operation] || '';
            }

            // نسبة مئوية
            percentage() {
                const value = parseFloat(this.currentOperand);
                if (!isNaN(value)) {
                    this.currentOperand = (value / 100).toString();
                    this.updateDisplay();
                }
            }

            // مسح الكل
            clear() {
                this.currentOperand = '0';
                this.previousOperand = '';
                this.operation = undefined;
                this.updateDisplay();
            }

            // حذف آخر رقم
            deleteLast() {
                if (this.currentOperand.length === 1 || 
                    (this.currentOperand.length === 2 && this.currentOperand.startsWith('-'))) {
                    this.currentOperand = '0';
                } else {
                    this.currentOperand = this.currentOperand.slice(0, -1);
                }
                this.updateDisplay();
            }

            // تحديث الشاشة
            updateDisplay() {
                document.getElementById('currentOperand').innerText = this.currentOperand;
                if (this.operation != null) {
                    document.getElementById('previousOperand').innerText = 
                        `${this.previousOperand} ${this.getOperationSymbol()}`;
                } else {
                    document.getElementById('previousOperand').innerText = '';
                }
            }

            // إضافة إلى التاريخ (تخزين محلي)
            addToHistory(entry) {
                this.history.unshift(entry);
                if (this.history.length > 10) this.history.pop();
                this.saveHistory();
                this.renderHistory();
            }

            // حفظ التاريخ في localStorage
            saveHistory() {
                localStorage.setItem('calc_history', JSON.stringify(this.history));
            }

            // تحميل التاريخ
            loadHistory() {
                const saved = localStorage.getItem('calc_history');
                if (saved) {
                    this.history = JSON.parse(saved);
                }
                this.renderHistory();
            }

            // عرض التاريخ
            renderHistory() {
                const historyDiv = document.getElementById('historyList');
                if (this.history.length === 0) {
                    historyDiv.innerHTML = '<div style="color:#666; text-align:center;">لا توجد عمليات سابقة</div>';
                    return;
                }
                historyDiv.innerHTML = this.history.map(item => 
                    `<div class="history-item">${item}</div>`
                ).join('');
            }

            // مسح التاريخ
            clearHistory() {
                this.history = [];
                this.saveHistory();
                this.renderHistory();
            }
        }

        // تهيئة الحاسبة
        const calc = new SmartCalculator();

        // ربط الأزرار
        document.getElementById('num0').addEventListener('click', () => calc.appendNumber('0'));
        document.getElementById('num1').addEventListener('click', () => calc.appendNumber('1'));
        document.getElementById('num2').addEventListener('click', () => calc.appendNumber('2'));
        document.getElementById('num3').addEventListener('click', () => calc.appendNumber('3'));
        document.getElementById('num4').addEventListener('click', () => calc.appendNumber('4'));
        document.getElementById('num5').addEventListener('click', () => calc.appendNumber('5'));
        document.getElementById('num6').addEventListener('click', () => calc.appendNumber('6'));
        document.getElementById('num7').addEventListener('click', () => calc.appendNumber('7'));
        document.getElementById('num8').addEventListener('click', () => calc.appendNumber('8'));
        document.getElementById('num9').addEventListener('click', () => calc.appendNumber('9'));
        document.getElementById('dot').addEventListener('click', () => calc.appendNumber('.'));
        
        document.getElementById('add').addEventListener('click', () => calc.chooseOperation('+'));
        document.getElementById('subtract').addEventListener('click', () => calc.chooseOperation('-'));
        document.getElementById('multiply').addEventListener('click', () => calc.chooseOperation('×'));
        document.getElementById('divide').addEventListener('click', () => calc.chooseOperation('÷'));
        document.getElementById('percent').addEventListener('click', () => calc.chooseOperation('%'));
        
        document.getElementById('equals').addEventListener('click', () => calc.compute());
        document.getElementById('clearAll').addEventListener('click', () => calc.clear());
        document.getElementById('delete').addEventListener('click', () => calc.deleteLast());
        document.getElementById('clearHistory').addEventListener('click', () => calc.clearHistory());
        
        // دعم لوحة المفاتيح
        document.addEventListener('keydown', (e) => {
            if (e.key >= '0' && e.key <= '9') calc.appendNumber(e.key);
            if (e.key === '.') calc.appendNumber('.');
            if (e.key === '+') calc.chooseOperation('+');
            if (e.key === '-') calc.chooseOperation('-');
            if (e.key === '*') calc.chooseOperation('×');
            if (e.key === '/') { e.preventDefault(); calc.chooseOperation('÷'); }
            if (e.key === 'Enter' || e.key === '=') calc.compute();
            if (e.key === 'Escape') calc.clear();
            if (e.key === 'Backspace') calc.deleteLast();
            if (e.key === '%') calc.chooseOperation('%');
        });

        // الوضع الليلي/النهاري
        let isDark = true;
        document.getElementById('themeToggle').addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                document.body.classList.remove('light-mode');
                document.getElementById('themeToggle').innerHTML = '🌙 وضع ليلي';
            } else {
                document.body.classList.add('light-mode');
                document.getElementById('themeToggle').innerHTML = '☀️ وضع نهاري';
            }
        });

        // منع اللمس الطويل من فتح القائمة
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('contextmenu', (e) => e.preventDefault());
        });
    </script>
</body>
</html>
